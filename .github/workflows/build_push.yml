name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:
    inputs:
      scope:
        description: Extensions to build
        type: choice
        default: mugua
        options: [mugua, changed, all]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Validate CI and select modules
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_build: ${{ steps.plan.outputs.has_build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Validate workflow syntax
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --location --retry 3 "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" -o "$archive"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color .github/workflows/build_push.yml
      - name: Test module selection
        run: python -m unittest discover -s .github/tests -v
      - name: Select build modules
        id: plan
        env:
          BUILD_SCOPE: ${{ inputs.scope || 'changed' }}
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/upstream' }}
          IS_PR_CHECK: 'true'
          CI_CHUNK_SIZE: '18'
          CI_MAX_RUNNERS: '4'
        run: python .github/scripts/ci-matrix.py --scope "$BUILD_SCOPE" --base "$BASE_REF"

  build:
    name: Build APKs (${{ matrix.chunk.number }})
    needs: prepare
    if: needs.prepare.outputs.has_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '17'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Build debug APKs and run core tests
        env:
          BUILD_TASKS: ${{ toJSON(matrix.chunk.modules) }}
          CHUNK_NUMBER: ${{ matrix.chunk.number }}
        run: |
          mapfile -t tasks < <(python3 -c 'import json, os; print("\n".join(json.loads(os.environ["BUILD_TASKS"])))')
          if [[ "$CHUNK_NUMBER" == 1 ]]; then
            tasks+=(":core:testDebugUnitTest")
          fi
          bash ./gradlew "${tasks[@]}" --no-daemon --continue --stacktrace --max-workers=2 -Dorg.gradle.jvmargs=-Xmx3g -Pkotlin.compiler.execution.strategy=in-process
      - name: Upload debug APKs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: debug-apks-${{ github.run_number }}-${{ matrix.chunk.number }}
          path: src/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-diagnostics-${{ github.run_number }}-${{ matrix.chunk.number }}
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  result:
    name: CI result
    if: always()
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require successful validation and builds
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          HAS_BUILD: ${{ needs.prepare.outputs.has_build }}
        run: |
          [[ "$PREPARE_RESULT" == success ]]
          if [[ "$HAS_BUILD" == true ]]; then
            [[ "$BUILD_RESULT" == success ]]
          else
            [[ "$BUILD_RESULT" == skipped ]]
          fi

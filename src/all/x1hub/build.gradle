ext {
    extName = 'X1hub'
    extClass = '.X1hub'
    extVersionCode = 1
    isNsfw = true
}

apply from: "$rootDir/common.gradle"

android.sourceSets {
    test {
        java.srcDirs = ['test']
        kotlin.srcDirs = ['test']
    }
}

dependencies {
    testImplementation(libs.junit)
    testImplementation(libs.jsoup)
    testImplementation(libs.okhttp)
    testImplementation(libs.coroutines.core)
}

tasks.withType(Test).configureEach {
    inputs.property('x1hubLiveTest', providers.environmentVariable('X1HUB_LIVE_TEST').orElse('0'))
}
